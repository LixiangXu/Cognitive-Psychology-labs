<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cognitive Psychology Labs — PSY 221</title>
    <meta name="description" content="Interactive cognitive psychology experiments and in-class demonstrations for PSY 221 at Wake Forest University.">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body class="page-index">
    <!--
      To add or change a lab, edit labs.js. This page is built from that list;
      you do not need to edit the HTML below.
    -->
    <header class="site-header">
      <div class="wrap">
        <h1 data-site="title">Cognitive Psychology Labs</h1>
        <p data-site="subtitle">PSY 221 A/B · Interactive experiments and in-class demonstrations</p>
      </div>
    </header>

    <main class="wrap">
      <div id="problems"></div>

      <section id="tools" class="tools" aria-label="Find a lab">
        <div class="tools-row">
          <label class="search">
            <span class="visually-hidden">Search labs</span>
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input id="search" type="search" placeholder="Search by title, topic or author" autocomplete="off">
            <kbd title="Press / to search">/</kbd>
          </label>
          <div class="segmented" role="group" aria-label="Show">
            <button type="button" data-type="all" aria-pressed="true">All</button>
            <button type="button" data-type="lab" aria-pressed="false">Labs</button>
            <button type="button" data-type="demo" aria-pressed="false">Demos</button>
          </div>
          <label class="sort">
            <span>Sort</span>
            <select id="sort">
              <option value="course">Course order</option>
              <option value="az">A to Z</option>
            </select>
          </label>
        </div>
        <div id="tag-bar" class="tag-bar" role="group" aria-label="Filter by topic"></div>
        <div class="status-row">
          <p id="count" class="count" aria-live="polite"></p>
          <button id="clear" type="button" class="btn-mini" hidden>Clear filters</button>
        </div>
      </section>

      <div id="grid" class="grid"></div>

      <div id="empty" class="notice" hidden>
        <strong>No labs match</strong>
        <p>Try a different word or remove a filter.</p>
        <button id="empty-clear" type="button" class="btn-mini">Clear filters</button>
      </div>

      <noscript><p class="notice">This page needs JavaScript to show the list of labs.</p></noscript>

      <section id="references" class="references" hidden>
        <h2>References</h2>
        <ol id="ref-list" class="ref-list"></ol>
      </section>
    </main>

    <footer class="site-footer">
      <p data-site="footer">Wake Forest University &middot; Department of Psychology</p>
    </footer>

    <script src="./labs.js"></script>
    <script src="./site.js"></script>
  </body>
</html>
